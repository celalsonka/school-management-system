<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .splash-container {
            text-align: center;
            color: white;
            animation: fadeIn 1s ease-in;
        }

        .logo-container {
            margin-bottom: 30px;
            animation: scaleIn 0.8s ease-out;
        }

        .logo {
            width: 150px;
            height: 150px;
            background: white;
            border-radius: 50%;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .logo-icon {
            font-size: 80px;
            color: #667eea;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 15px;
            font-weight: 700;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.2);
            animation: slideDown 0.8s ease-out 0.2s both;
        }

        .subtitle {
            font-size: 20px;
            margin-bottom: 40px;
            opacity: 0.9;
            animation: slideUp 0.8s ease-out 0.4s both;
        }

        .enter-btn {
            display: inline-block;
            padding: 15px 50px;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 600;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            animation: slideUp 0.8s ease-out 0.6s both;
            cursor: pointer;
            border: none;
        }

        .enter-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            background: #f8f9fa;
        }

        .enter-btn:active {
            transform: translateY(-1px);
        }

        .loading-dots {
            margin-top: 30px;
            animation: slideUp 0.8s ease-out 0.8s both;
        }

        .dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
            margin: 0 5px;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes slideDown {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0);
            }
            40% {
                transform: scale(1);
            }
        }

        .version {
            position: absolute;
            bottom: 20px;
            right: 30px;
            color: rgba(255,255,255,0.7);
            font-size: 14px;
        }

        .features {
            margin-top: 50px;
            display: flex;
            justify-content: center;
            gap: 30px;
            animation: slideUp 0.8s ease-out 1s both;
        }

        .feature {
            text-align: center;
            padding: 15px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            backdrop-filter: blur(10px);
            min-width: 150px;
        }

        .feature-icon {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .feature-text {
            font-size: 14px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <div class="logo-container">
            <div class="logo">
                <span class="logo-icon">🎓</span>
            </div>
        </div>
        
        <h1>School Auto</h1>
        <p class="subtitle">Okul Yönetim Sistemi</p>
        
        <button class="enter-btn" onclick="enterApp()">
            Uygulamaya Giriş
        </button>
        
        <div class="features">
            <div class="feature">
                <div class="feature-icon">👥</div>
                <div class="feature-text">Öğrenci Yönetimi</div>
            </div>
            <div class="feature">
                <div class="feature-icon">📚</div>
                <div class="feature-text">Ders Takibi</div>
            </div>
            <div class="feature">
                <div class="feature-icon">📊</div>
                <div class="feature-text">Sınav Sistemi</div>
            </div>
            <div class="feature">
                <div class="feature-icon">📅</div>
                <div class="feature-text">Devamsızlık Kontrolü</div>
            </div>
        </div>
        
        <div class="loading-dots">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>
    </div>
    
    <div class="version">v1.0.0</div>

    <script>
        function enterApp() {
            // Add fade out effect before redirecting
            document.querySelector('.splash-container').style.animation = 'fadeOut 0.5s ease-out';
            setTimeout(() => {
                window.location.href = '/persons/HomePage';
            }, 500);
        }

        // Optional: Auto-redirect after 5 seconds
        // Uncomment the line below if you want automatic redirect
        // setTimeout(enterApp, 5000);

        // Add fade out animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeOut {
                from {
                    opacity: 1;
                    transform: scale(1);
                }
                to {
                    opacity: 0;
                    transform: scale(0.95);
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
