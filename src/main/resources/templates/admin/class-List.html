<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Class Directory</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3><i class="fas fa-layer-group"></i> Class Directory</h3>
        <a th:href="@{/admin/showFormForAddClass}" class="btn btn-primary">
            <i class="fas fa-plus"></i> Add New Class
        </a>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Class Name</th>
                        <th>Class Level</th>
                        <th>Lesson</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="class : ${classes}">
                        <td th:text="${class.classId}"></td>
                        <td th:text="${class.className}"></td>
                        <td th:text="${class.classLevel}"></td>
                        <td th:text="${class.lesson != null ? class.lesson.lessonName : 'No Lesson'}"></td>
                        <td>
                            <a th:href="@{/admin/showFormForUpdateClass(classId=${class.classId})}"
                               class="btn btn-sm btn-outline-primary">
                                <i class="fas fa-edit"></i> Update
                            </a>
                            <a th:href="@{/admin/deleteClass(classId=${class.classId})}"
                               class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('Are you sure you want to delete this class?');">
                                <i class="fas fa-trash"></i> Delete
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(classes)}">
                        <td colspan="5" class="text-center text-muted">No classes found</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="mt-3">
        <a th:href="@{/admin/showCatalog}" class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i> Back to Catalog
        </a>
    </div>
</div>
</body>
</html>
