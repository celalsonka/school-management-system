<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lesson Directory</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3><i class="fas fa-book"></i> Lesson Directory</h3>
        <a th:href="@{/admin/showFormForAddLesson}" class="btn btn-primary">
            <i class="fas fa-plus"></i> Add New Lesson
        </a>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Lesson Code</th>
                        <th>Lesson Name</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="lesson : ${lessons}">
                        <td th:text="${lesson.lessonId}"></td>
                        <td th:text="${lesson.lessonCode}"></td>
                        <td th:text="${lesson.lessonName}"></td>
                        <td>
                            <a th:href="@{/admin/showFormForUpdateLesson(lessonId=${lesson.lessonId})}"
                               class="btn btn-sm btn-outline-primary">
                                <i class="fas fa-edit"></i> Update
                            </a>
                            <a th:href="@{/admin/deleteLesson(lessonId=${lesson.lessonId})}"
                               class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('Are you sure you want to delete this lesson?');">
                                <i class="fas fa-trash"></i> Delete
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(lessons)}">
                        <td colspan="4" class="text-center text-muted">No lessons found</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="mt-3">
        <a th:href="@{/admin/showCatalog}" class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i> Back to Catalog
        </a>
    </div>
</div>
</body>
</html>
