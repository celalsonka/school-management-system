<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Parent Students</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="row">
        <!-- Left Column: Associated Students -->
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0">
                        <i class="fas fa-check-circle"></i> Associated Students
                    </h5>
                </div>
                <div class="card-body">
                    <p class="text-muted">
                        <strong>Parent:</strong> <span th:text="${parent.person.firstName + ' ' + parent.person.lastName}"></span>
                    </p>
                    <div th:if="${#lists.isEmpty(parent.students)}" class="alert alert-info">
                        No students associated yet.
                    </div>
                    <div th:unless="${#lists.isEmpty(parent.students)}" class="list-group">
                        <div th:each="student : ${parent.students}" class="list-group-item d-flex justify-content-between align-items-center">
                            <div>
                                <strong th:text="${student.person.firstName + ' ' + student.person.lastName}"></strong>
                                <br>
                                <small class="text-muted">Student No: <span th:text="${student.studentNo}"></span></small>
                            </div>
                            <a th:href="@{/admin/removeStudentFromParent(parentId=${parent.id}, studentId=${student.id})}"
                               class="btn btn-sm btn-danger"
                               onclick="return confirm('Remove this student from parent?');">
                                <i class="fas fa-times"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Column: Available Students to Add -->
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">
                        <i class="fas fa-plus-circle"></i> Add Students
                    </h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/admin/addStudentToParent}" method="POST" class="mb-3">
                        <input type="hidden" name="parentId" th:value="${parent.id}"/>
                        
                        <div class="mb-3">
                            <label for="studentId" class="form-label">Select Student <span class="text-danger">*</span></label>
                            <select name="studentId" class="form-select" id="studentId" required>
                                <option value="">Choose a student...</option>
                                <option th:each="student : ${availableStudents}" 
                                        th:value="${student.id}"
                                        th:text="${student.person.firstName + ' ' + student.person.lastName + ' (ID: ' + student.id + ')'}">
                                </option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="relationshipDegree" class="form-label">Relationship Degree <span class="text-danger">*</span></label>
                            <select name="relationshipDegree" class="form-select" id="relationshipDegree" required>
                                <option value="">Select relationship</option>
                                <option value="Father">Father</option>
                                <option value="Mother">Mother</option>
                                <option value="Guardian">Guardian</option>
                                <option value="Grandfather">Grandfather</option>
                                <option value="Grandmother">Grandmother</option>
                                <option value="Uncle">Uncle</option>
                                <option value="Aunt">Aunt</option>
                                <option value="Cousin">Cousin</option>
                                <option value="Brother">Brother</option>
                                <option value="Sister">Sister</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-success w-100">
                            <i class="fas fa-plus"></i> Add Student
                        </button>
                    </form>

                    <div th:if="${#lists.isEmpty(availableStudents)}" class="alert alert-warning">
                        <i class="fas fa-info-circle"></i> All students are already associated with this parent.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-4">
        <a th:href="@{/admin/parentList}" class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i> Back to Parent List
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
