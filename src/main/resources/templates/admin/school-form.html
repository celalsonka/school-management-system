<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>School Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h4 class="mb-0">
                        <i class="fas fa-school"></i>
                        <span th:if="${school.schoolId == null}">Add New School</span>
                        <span th:if="${school.schoolId != null}">Update School</span>
                    </h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/admin/saveSchool}" th:object="${school}" method="POST">
                        <input type="hidden" th:field="*{schoolId}"/>

                        <div class="mb-3">
                            <label for="schoolName" class="form-label">School Name <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{schoolName}" class="form-control" id="schoolName" required>
                        </div>

                        <div class="mb-3">
                            <label for="address" class="form-label">Address</label>
                            <textarea th:field="*{address}" class="form-control" id="address" rows="3"></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="schoolPhone" class="form-label">Phone Number</label>
                            <input type="tel" th:field="*{schoolPhone}" class="form-control" id="schoolPhone">
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password <span class="text-danger">*</span></label>
                            <input type="password" th:field="*{password}" class="form-control" id="password" required>
                            <div class="form-text">Password for school admin access</div>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a th:href="@{/admin/schoolList}" class="btn btn-secondary me-md-2">
                                <i class="fas fa-times"></i> Cancel
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i>
                                <span th:if="${school.schoolId == null}">Add School</span>
                                <span th:if="${school.schoolId != null}">Update School</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
