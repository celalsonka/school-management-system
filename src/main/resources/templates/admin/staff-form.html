<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Staff Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-10">
            <div class="card">
                <div class="card-header">
                    <h4 class="mb-0">
                        <i class="fas fa-user-cog"></i>
                        <span th:if="${staff.id == null}">Add New Staff</span>
                        <span th:if="${staff.id != null}">Update Staff</span>
                    </h4>
                </div>
                <div class="card-body">
                    <!-- Error message display -->
                    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="fas fa-exclamation-circle"></i>
                        <span th:text="${errorMessage}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                    
                    <form th:action="@{/admin/saveStaff}" th:object="${staff}" method="POST">
                        <input type="hidden" th:field="*{id}"/>

                        <div class="row">
                            <div class="col-md-6">
                                <h5 class="text-primary mb-3">Personal Information</h5>
                                
                                <div class="mb-3">
                                    <label for="firstName" class="form-label">First Name <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{person.firstName}" class="form-control" id="firstName" required>
                                </div>

                                <div class="mb-3">
                                    <label for="lastName" class="form-label">Last Name <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{person.lastName}" class="form-control" id="lastName" required>
                                </div>

                                <div class="mb-3">
                                    <label for="password" class="form-label">Password <span class="text-danger">*</span></label>
                                    <input type="password" th:field="*{person.password}" class="form-control" id="password" required>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <h5 class="text-primary mb-3">Professional Information</h5>
                                
                                <div class="mb-3">
                                    <label for="employeeNumber" class="form-label">Employee Number <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{employeeNumber}" class="form-control" id="employeeNumber" required>
                                </div>

                                <div class="mb-3">
                                    <label for="duty" class="form-label">Duty</label>
                                    <input type="text" th:field="*{duty}" class="form-control" id="duty">
                                </div>

                                <div class="mb-3">
                                    <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
                                    <input type="email" th:field="*{email}" class="form-control" id="email" required>
                                </div>

                                <div class="mb-3">
                                    <label for="phoneNumber" class="form-label">Phone Number</label>
                                    <input type="tel" th:field="*{phoneNumber}" class="form-control" id="phoneNumber">
                                </div>

                                <div class="mb-3">
                                    <label for="hireDate" class="form-label">Hire Date <span class="text-danger">*</span></label>
                                    <input type="date" th:field="*{hireDate}" class="form-control" id="hireDate" required>
                                </div>
                            </div>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                            <a th:href="@{/admin/staffList}" class="btn btn-secondary me-md-2">
                                <i class="fas fa-times"></i> Cancel
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i>
                                <span th:if="${staff.id == null}">Add Staff</span>
                                <span th:if="${staff.id != null}">Update Staff</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
