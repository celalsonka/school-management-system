<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Absences</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3><i class="fas fa-calendar-times"></i> Absence Records</h3>
            <p class="text-muted">Student: <strong th:text="${student.person.firstName + ' ' + student.person.lastName}"></strong></p>
        </div>
        <a th:href="@{/admin/showFormForAddAbsence(studentId=${student.id})}" class="btn btn-primary">
            <i class="fas fa-plus"></i> Add Absence
        </a>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead class="table-dark">
                    <tr>
                        <th>Date</th>
                        <th>Type</th>
                        <th>Lesson Hour</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="absence : ${absences}">
                        <td th:text="${absence.date}"></td>
                        <td>
                            <span th:if="${absence.absenceType == 'Excused'}" class="badge bg-success">
                                <i class="fas fa-check"></i> Excused
                            </span>
                            <span th:if="${absence.absenceType == 'Unexcused'}" class="badge bg-danger">
                                <i class="fas fa-times"></i> Unexcused
                            </span>
                            <span th:if="${absence.absenceType == 'Sick Leave'}" class="badge bg-warning text-dark">
                                <i class="fas fa-hospital"></i> Sick Leave
                            </span>
                            <span th:if="${absence.absenceType == 'Permission'}" class="badge bg-info">
                                <i class="fas fa-hand-paper"></i> Permission
                            </span>
                        </td>
                        <td th:text="${absence.lessonHour}"></td>
                        <td>
                            <a th:href="@{/admin/showFormForUpdateAbsence(absenceId=${absence.absenceId}, studentId=${student.id})}"
                               class="btn btn-sm btn-outline-primary">
                                <i class="fas fa-edit"></i> Edit
                            </a>
                            <a th:href="@{/admin/deleteAbsence(absenceId=${absence.absenceId}, studentId=${student.id})}"
                               class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('Are you sure you want to delete this absence record?');">
                                <i class="fas fa-trash"></i> Delete
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(absences)}">
                        <td colspan="4" class="text-center text-muted">No absence records found</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="mt-3">
        <a th:href="@{/admin/studentList}" class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i> Back to Student List
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
