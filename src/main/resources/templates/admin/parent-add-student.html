<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Parent-Student Relationships</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="row">
        <div class="col-md-12">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">
                        <i class="fas fa-user-friends"></i>
                        Manage Students for Parent: 
                        <span th:text="${parent.person.firstName + ' ' + parent.person.lastName}"></span>
                    </h4>
                </div>
                <div class="card-body">
                    <!-- Add New Student Form -->
                    <div class="card mb-4">
                        <div class="card-header bg-light">
                            <h5 class="mb-0">
                                <i class="fas fa-plus-circle"></i>
                                Add Student Relationship
                            </h5>
                        </div>
                        <div class="card-body">
                            <form th:action="@{/admin/addStudentToParent}" method="POST">
                                <input type="hidden" name="parentId" th:value="${parent.id}"/>
                                
                                <div class="row">
                                    <div class="col-md-5">
                                        <label for="studentId" class="form-label">Select Student <span class="text-danger">*</span></label>
                                        <select name="studentId" id="studentId" class="form-select" required>
                                            <option value="">-- Select a student --</option>
                                            <option th:each="student : ${students}" 
                                                    th:value="${student.id}"
                                                    th:text="${student.person.firstName + ' ' + student.person.lastName + ' (No: ' + student.studentNo + ')'}">
                                            </option>
                                        </select>
                                    </div>
                                    
                                    <div class="col-md-4">
                                        <label for="relationshipDegree" class="form-label">Relationship <span class="text-danger">*</span></label>
                                        <select name="relationshipDegree" id="relationshipDegree" class="form-select" required>
                                            <option value="">-- Select relationship --</option>
                                            <option value="Mother">Mother</option>
                                            <option value="Father">Father</option>
                                            <option value="Guardian">Guardian</option>
                                            <option value="Stepmother">Stepmother</option>
                                            <option value="Stepfather">Stepfather</option>
                                            <option value="Grandmother">Grandmother</option>
                                            <option value="Grandfather">Grandfather</option>
                                            <option value="Aunt">Aunt</option>
                                            <option value="Uncle">Uncle</option>
                                            <option value="Sister">Sister</option>
                                            <option value="Brother">Brother</option>
                                            <option value="Other">Other</option>
                                        </select>
                                    </div>
                                    
                                    <div class="col-md-3 d-flex align-items-end">
                                        <button type="submit" class="btn btn-success w-100">
                                            <i class="fas fa-plus"></i> Add Relationship
                                        </button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>

                    <!-- Existing Relationships Table -->
                    <div class="card">
                        <div class="card-header bg-light">
                            <h5 class="mb-0">
                                <i class="fas fa-list"></i>
                                Current Student Relationships
                            </h5>
                        </div>
                        <div class="card-body">
                            <div th:if="${existingRelations.isEmpty()}" class="alert alert-info">
                                <i class="fas fa-info-circle"></i>
                                No students associated with this parent yet.
                            </div>
                            
                            <table th:if="${!existingRelations.isEmpty()}" class="table table-striped table-hover">
                                <thead class="table-dark">
                                    <tr>
                                        <th>Student Name</th>
                                        <th>Student Number</th>
                                        <th>Relationship</th>
                                        <th>Classroom</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="relation : ${existingRelations}">
                                        <td th:text="${relation.student.person.firstName + ' ' + relation.student.person.lastName}"></td>
                                        <td th:text="${relation.student.studentNo}"></td>
                                        <td>
                                            <span class="badge bg-info" th:text="${relation.relationshipDegree}"></span>
                                        </td>
                                        <td th:text="${relation.student.classroom != null ? relation.student.classroom.classroomCode : 'Not Assigned'}"></td>
                                        <td>
                                            <a th:href="@{/admin/removeStudentFromParent(parentId=${parent.id}, studentId=${relation.student.id})}"
                                               class="btn btn-danger btn-sm"
                                               onclick="return confirm('Are you sure you want to remove this relationship?');">
                                                <i class="fas fa-trash"></i> Remove
                                            </a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div class="mt-3">
                        <a th:href="@{/admin/parentList}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left"></i> Back to Parent List
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
