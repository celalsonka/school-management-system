<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Parent Directory</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3><i class="fas fa-user-friends"></i> Parent Directory</h3>
        <a th:href="@{/admin/showFormForAddParent}" class="btn btn-primary">
            <i class="fas fa-plus"></i> Add New Parent
        </a>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Students Count</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="parent : ${parents}">
                        <td th:text="${parent.id}"></td>
                        <td th:text="${parent.person != null ? parent.person.firstName + ' ' + parent.person.lastName : 'N/A'}"></td>
                        <td>
                            <span class="badge bg-success" th:text="${parent.parentStudents != null ? parent.parentStudents.size() : 0}"></span>
                        </td>
                        <td>
                            <a th:href="@{/admin/showFormForUpdateParent(parentId=${parent.id})}"
                               class="btn btn-sm btn-outline-primary">
                                <i class="fas fa-edit"></i> Update
                            </a>
                            <a th:href="@{/admin/showAddStudentToParent(parentId=${parent.id})}"
                               class="btn btn-sm btn-outline-info">
                                <i class="fas fa-users"></i> Manage Students
                            </a>
                            <a th:href="@{/admin/deleteParent(parentId=${parent.id})}"
                               class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('Are you sure you want to delete this parent?');">
                                <i class="fas fa-trash"></i> Delete
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(parents)}">
                        <td colspan="5" class="text-center text-muted">No parents found</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="mt-3">
        <a th:href="@{/admin/showCatalog}" class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i> Back to Catalog
        </a>
    </div>
</div>
</body>
</html>
