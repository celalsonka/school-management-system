<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Parent Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h4 class="mb-0">
                        <i class="fas fa-user-friends"></i>
                        <span th:if="${parent.id == null}">Add New Parent</span>
                        <span th:if="${parent.id != null}">Update Parent</span>
                    </h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/admin/saveParent}" th:object="${parent}" method="POST">
                        <!-- Hidden field for ID -->
                        <input type="hidden" th:field="*{id}"/>

                        <div class="row">
                            <!-- Personal Information -->
                            <div class="col-md-6">
                                <h5 class="text-primary mb-3">Personal Information</h5>
                                
                                <!-- First Name -->
                                <div class="mb-3">
                                    <label for="firstName" class="form-label">First Name <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{person.firstName}" class="form-control" id="firstName" 
                                           placeholder="Enter first name" required>
                                </div>

                                <!-- Last Name -->
                                <div class="mb-3">
                                    <label for="lastName" class="form-label">Last Name <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{person.lastName}" class="form-control" id="lastName" 
                                           placeholder="Enter last name" required>
                                </div>

                                <!-- Password -->
                                <div class="mb-3">
                                    <label for="password" class="form-label">Password <span class="text-danger">*</span></label>
                                    <input type="password" th:field="*{person.password}" class="form-control" id="password" 
                                           placeholder="Enter password" required>
                                </div>
                            </div>

                            <!-- Parent Information -->
                            <div class="col-md-6">
                                <h5 class="text-primary mb-3">Parent Information</h5>
                                
                                <!-- Students Selection -->
                                <div class="mb-3">
                                    <label class="form-label">Associated Students</label>
                                    <div class="form-text">Students and relationships can be added from the parent list after creating the parent</div>
                                </div>
                            </div>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                            <a th:href="@{/admin/parentList}" class="btn btn-secondary me-md-2">
                                <i class="fas fa-times"></i> Cancel
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i>
                                <span th:if="${parent.id == null}">Add Parent</span>
                                <span th:if="${parent.id != null}">Update Parent</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
