<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Discipline Records</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3><i class="fas fa-exclamation-circle"></i> Discipline Records</h3>
            <p class="text-muted">Student: <strong th:text="${student.person.firstName + ' ' + student.person.lastName}"></strong></p>
        </div>
        <a th:href="@{/admin/showFormForAddDisciplineRecord(studentId=${student.id})}" class="btn btn-danger">
            <i class="fas fa-plus"></i> Add Record
        </a>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead class="table-dark">
                    <tr>
                        <th>Date</th>
                        <th>Reason</th>
                        <th>Result</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="record : ${disciplineRecords}">
                        <td th:text="${record.recordDate}"></td>
                        <td th:text="${record.reason}"></td>
                        <td>
                            <span th:if="${record.result == 'Warning'}" class="badge bg-warning text-dark">
                                <i class="fas fa-exclamation-triangle"></i> Warning
                            </span>
                            <span th:if="${record.result == 'Suspension'}" class="badge bg-danger">
                                <i class="fas fa-ban"></i> Suspension
                            </span>
                            <span th:if="${record.result == 'Detention'}" class="badge bg-secondary">
                                <i class="fas fa-clock"></i> Detention
                            </span>
                            <span th:if="${record.result == 'Parent Meeting'}" class="badge bg-info">
                                <i class="fas fa-users"></i> Parent Meeting
                            </span>
                            <span th:if="${record.result == 'Other'}" class="badge bg-secondary">
                                <i class="fas fa-file"></i> Other
                            </span>
                        </td>
                        <td>
                            <a th:href="@{/admin/showFormForUpdateDisciplineRecord(disciplineRecordId=${record.disciplineRecordId}, studentId=${student.id})}"
                               class="btn btn-sm btn-outline-primary">
                                <i class="fas fa-edit"></i> Edit
                            </a>
                            <a th:href="@{/admin/deleteDisciplineRecord(disciplineRecordId=${record.disciplineRecordId}, studentId=${student.id})}"
                               class="btn btn-sm btn-outline-danger"
                               onclick="return confirm('Are you sure you want to delete this discipline record?');">
                                <i class="fas fa-trash"></i> Delete
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(disciplineRecords)}">
                        <td colspan="4" class="text-center text-muted">No discipline records found</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="mt-3">
        <a th:href="@{/admin/studentList}" class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i> Back to Student List
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
