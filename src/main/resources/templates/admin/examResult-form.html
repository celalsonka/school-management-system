<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${examResult.resultId > 0 ? 'Update Exam Result' : 'Add Exam Result'}">Exam Result Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="row mb-4">
        <div class="col-md-8">
            <h2 th:text="${examResult.resultId > 0 ? 'Update Exam Result' : 'Add Exam Result'}">
                <i class="fas fa-file-alt"></i>
            </h2>
            <p class="text-muted">
                Student: <strong th:text="${student != null ? student.person.firstName + ' ' + student.person.lastName : 'N/A'}"></strong>
            </p>
        </div>
        <div class="col-md-4 text-end">
            <a th:href="@{/admin/examResults(studentId=${student.id})}" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Back to Results
            </a>
        </div>
    </div>

    <div class="card">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0"><i class="fas fa-edit"></i> Exam Result Details</h5>
        </div>
        <div class="card-body">
            <form th:action="${examResult.resultId > 0 ? '/admin/updateExamResult' : '/admin/saveExamResult'}" 
                  th:object="${examResult}" method="POST" class="row g-3">

                <!-- Hidden field for student ID -->
                <input type="hidden" th:field="*{student.id}">
                
                <!-- Hidden field for result ID (on update) -->
                <input type="hidden" th:if="${examResult.resultId > 0}" th:field="*{resultId}">

                <!-- Exam Selection -->
                <div class="col-md-6">
                    <label for="examIdSelect" class="form-label"><i class="fas fa-book"></i> Exam</label>
                    <select id="examIdSelect" name="examId" class="form-select" required>
                        <option value="">-- Select Exam --</option>
                        <option th:each="exam : ${exams}" 
                                th:value="${exam.examId}"
                                th:selected="${examResult.exam != null && examResult.exam.examId == exam.examId}"
                                th:text="${exam.examType + ' - ' + exam.date + ' (' + exam.hour + ')'}">
                        </option>
                    </select>
                </div>

                <!-- Score -->
                <div class="col-md-6">
                    <label for="score" class="form-label"><i class="fas fa-star"></i> Score</label>
                    <input type="number" id="score" th:field="*{score}" 
                           class="form-control" min="0" max="100" step="0.5" placeholder="Enter score (0-100)">
                    <small class="form-text text-muted">Leave empty if exam is not graded yet</small>
                </div>

                <!-- Submit Buttons -->
                <div class="col-12">
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary" 
                                th:text="${examResult.resultId > 0 ? 'Update Exam Result' : 'Add Exam Result'}">
                            <i class="fas fa-save"></i>
                        </button>
                        <a th:href="@{/admin/examResults(studentId=${student.id})}" class="btn btn-secondary">
                            <i class="fas fa-times"></i> Cancel
                        </a>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="mt-3">
        <a th:href="@{/admin/examResults(studentId=${student.id})}" class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i> Back to Results
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
