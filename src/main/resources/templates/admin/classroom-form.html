<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Classroom Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h4 class="mb-0">
                        <i class="fas fa-door-open"></i>
                        <span th:if="${classroom.classroomCode == null}">Add New Classroom</span>
                        <span th:if="${classroom.classroomCode != null}">Update Classroom</span>
                    </h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/admin/saveClassroom}" th:object="${classroom}" method="POST">
                        <!-- Hidden field to store original classroom code for updates -->
                        <input type="hidden" th:if="${classroom.classroomCode != null}" name="originalClassroomCode" th:value="${classroom.classroomCode}">
                        
                        <div class="mb-3">
                            <label for="classroomCode" class="form-label">Classroom Code <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{classroomCode}" class="form-control" id="classroomCode" required>
                        </div>

                        <div class="mb-3">
                            <label for="capacity" class="form-label">Capacity</label>
                            <input type="number" th:field="*{capacity}" class="form-control" id="capacity" min="1">
                        </div>

                        <div class="mb-3">
                            <label for="type" class="form-label">Type</label>
                            <select th:field="*{type}" class="form-select" id="type">
                                <option value="">Select type</option>
                                <option value="Lecture Hall">Lecture Hall</option>
                                <option value="Laboratory">Laboratory</option>
                                <option value="Computer Lab">Computer Lab</option>
                                <option value="Library">Library</option>
                                <option value="Meeting Room">Meeting Room</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="location" class="form-label">Location</label>
                            <input type="text" th:field="*{location}" class="form-control" id="location">
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a th:href="@{/admin/classroomList}" class="btn btn-secondary me-md-2">
                                <i class="fas fa-times"></i> Cancel
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i>
                                <span th:if="${classroom.classroomCode == null}">Add Classroom</span>
                                <span th:if="${classroom.classroomCode != null}">Update Classroom</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
