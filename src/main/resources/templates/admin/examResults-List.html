<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Exam Results</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="row mb-4">
        <div class="col-md-8">
            <h2><i class="fas fa-chart-bar"></i> Exam Results</h2>
            <p class="text-muted">
                Student: <strong th:text="${student != null ? student.person.firstName + ' ' + student.person.lastName : 'N/A'}"></strong>
            </p>
        </div>
        <div class="col-md-4 text-end">
            <a th:href="@{/admin/studentList}" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Back to Students
            </a>
        </div>
    </div>

    <div class="card">
        <div class="card-header bg-info text-white d-flex justify-content-between align-items-center">
            <h5 class="mb-0"><i class="fas fa-list"></i> Exam Results List</h5>
            <a th:if="${student != null}" th:href="@{/admin/showFormForAddExamResult(studentId=${student.id})}" class="btn btn-sm btn-light">
                <i class="fas fa-plus"></i> Add Exam Result
            </a>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                    <tr>
                        <th>Exam Type</th>
                        <th>Date</th>
                        <th>Hour</th>
                        <th>Lesson</th>
                        <th>Score</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="result : ${examResults}">
                        <td th:text="${result.exam.examType}"></td>
                        <td th:text="${result.exam.date}"></td>
                        <td th:text="${result.exam.hour}"></td>
                        <td th:text="${result.exam.lesson != null ? result.exam.lesson.lessonName : '-'}"></td>
                        <td>
                            <span th:if="${result.score != null}" 
                                  th:text="${result.score}" 
                                  th:class="${result.score >= 50 ? 'badge bg-success' : 'badge bg-danger'}"></span>
                            <span th:if="${result.score == null}" class="badge bg-secondary">Not Graded</span>
                        </td>
                        <td>
                            <span th:if="${result.score != null && result.score >= 50}" class="badge bg-success">
                                <i class="fas fa-check"></i> Passed
                            </span>
                            <span th:if="${result.score != null && result.score < 50}" class="badge bg-danger">
                                <i class="fas fa-times"></i> Failed
                            </span>
                            <span th:if="${result.score == null}" class="badge bg-secondary">
                                <i class="fas fa-clock"></i> Pending
                            </span>
                        </td>
                        <td>
                            <a th:href="@{/admin/showFormForUpdateExamResult(resultId=${result.resultId})}" 
                               class="btn btn-sm btn-warning" title="Edit">
                                <i class="fas fa-edit"></i>
                            </a>
                            <a th:if="${student != null}" th:href="@{/admin/deleteExamResult(resultId=${result.resultId}, studentId=${student.id})}" 
                               class="btn btn-sm btn-danger" 
                               onclick="return confirm('Are you sure you want to delete this exam result?')" 
                               title="Delete">
                                <i class="fas fa-trash"></i>
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(examResults)}">
                        <td colspan="7" class="text-center text-muted">
                            <i class="fas fa-inbox"></i> No exam results found for this student
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="mt-3">
        <a th:href="@{/admin/studentList}" class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i> Back to Students
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
