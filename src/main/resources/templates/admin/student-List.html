<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Directory</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3><i class="fas fa-user-cog"></i> Student Directory</h3>
        <a th:href="@{/admin/showFormForAddStudent}" class="btn btn-primary">
            <i class="fas fa-plus"></i> Add New Student
        </a>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Average Score</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="student : ${students}">
                        <td th:text="${student.id}"></td>
                        <td th:text="${student.person != null ? student.person.firstName + ' ' + student.person.lastName : 'N/A'}"></td>
                        <td>
                            <span th:if="${studentAverages.get(student.id) != null && studentAverages.get(student.id) > 0}">
                                <span th:text="${#numbers.formatDecimal(studentAverages.get(student.id), 1, 2)}" 
                                      th:classappend="${
                                        studentAverages.get(student.id) >= 90 ? 'badge bg-success' : 
                                        studentAverages.get(student.id) >= 80 ? 'badge bg-primary' : 
                                        studentAverages.get(student.id) >= 70 ? 'badge bg-info' : 
                                        studentAverages.get(student.id) >= 60 ? 'badge bg-warning' : 
                                        'badge bg-danger'
                                      }">
                                </span>
                            </span>
                            <span th:unless="${studentAverages.get(student.id) != null && studentAverages.get(student.id) > 0}" 
                                  class="badge bg-secondary">No Exams</span>
                        </td>

                        <td>
                            <div class="btn-group" role="group">
                                <a th:href="@{/admin/showFormForUpdateStudent(studentId=${student.id})}"
                                   class="btn btn-sm btn-outline-primary" title="Edit Student">
                                    <i class="fas fa-edit"></i> Update
                                </a>
                                <a th:href="@{/admin/examResults(studentId=${student.id})}"
                                   class="btn btn-sm btn-outline-info" title="View Exam Results">
                                    <i class="fas fa-chart-bar"></i> Exams
                                </a>
                                <a th:href="@{/admin/absenceList(studentId=${student.id})}"
                                   class="btn btn-sm btn-outline-warning" title="Manage Absences">
                                    <i class="fas fa-calendar-times"></i> Absences
                                </a>
                                <a th:href="@{/admin/disciplineRecordList(studentId=${student.id})}"
                                   class="btn btn-sm btn-outline-danger" title="Manage Discipline Records">
                                    <i class="fas fa-exclamation-circle"></i> Discipline
                                </a>
                                <a th:href="@{/admin/deleteStudent(studentId=${student.id})}"
                                   class="btn btn-sm btn-outline-secondary"
                                   onclick="return confirm('Are you sure you want to delete this student?');"
                                   title="Delete Student">
                                    <i class="fas fa-trash"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(students)}">
                        <td colspan="6" class="text-center text-muted">No student found</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="mt-3">
        <a th:href="@{/admin/showCatalog}" class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i> Back to Catalog
        </a>
    </div>
</div>
</body>
</html>
