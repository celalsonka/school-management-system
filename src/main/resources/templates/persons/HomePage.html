<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Home Page</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        .login-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 450px;
            width: 100%;
            margin: 0 auto;
        }
        .login-title {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
            text-align: center;
            margin-bottom: 10px;
        }
        .login-subtitle {
            color: #666;
            text-align: center;
            font-weight: 600;
            margin-bottom: 30px;
        }
        .form-control {
            border-radius: 10px;
            border: 2px solid #e0e0e0;
            padding: 12px 20px;
            transition: all 0.3s ease;
            width: 100% !important;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .fancy-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 14px 30px;
            font-weight: 600;
            font-size: 16px;
            width: 100%;
            margin-top: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        .fancy-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        .fancy-button:active {
            transform: translateY(0);
        }
        .admin-button {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
        }
        .admin-button:hover {
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.6);
        }
        .register-link {
            display: inline-block;
            margin-top: 20px;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            text-align: center;
            width: 100%;
        }
        .register-link:hover {
            color: #764ba2;
            transform: scale(1.05);
        }
        .error-message {
            background: #ffe0e0;
            color: #d32f2f;
            padding: 12px 20px;
            border-radius: 10px;
            margin-top: 15px;
            text-align: center;
            font-weight: 500;
        }
        .divider {
            margin: 20px 0;
            border: 0;
            border-top: 2px solid #f0f0f0;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="login-container">
        <h3 class="login-title">HOME PAGE</h3>
        <p class="login-subtitle">LOGIN PAGE</p>

        <form action="#" th:action="@{/persons/login}"
              th:object="${person}" method="POST">
            <!-- Add hidden form field to handle the uptde -->
            <input type="hidden" th:field="*{id}">

            <input type="text" th:field="*{firstName}"
                   class="form-control mb-3" placeholder="First name">
            <input type="text" th:field="*{password}"
                   class="form-control mb-3" placeholder="Password">
            <button type="submit" class="fancy-button">🔐 Login</button>
        </form>

        <hr class="divider">

        <form action="#" th:action="@{/admin/school-login}">
            <button type="submit" class="fancy-button admin-button">👨‍💼 Admin Login</button>
        </form>

        <div th:if="${error}" class="error-message">
            <p th:text="${error}" style="margin: 0;"></p>
        </div>

        <a th:href="@{/persons/register}" class="register-link">📝 Create New Account</a>
    </div>


</div>
</body>

</html>
