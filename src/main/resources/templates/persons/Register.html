<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

<div class="container">
    <h3>Person Directory</h3>
    <hr>
    <p class="h4 mb-4"> Save Person</p>

    <form action="#" th:action="@{/persons/save}"
          th:object="${person}" method="POST">
        <!-- Add hidden form field to handle the uptde -->
        <input type="hidden" th:field="*{id}">

        <input type="text" th:field="*{firstName}"
               class="form-control mb-4 w-25" placeholder="First name">
        <input type="text" th:field="*{lastName}"
               class="form-control mb-4 w-25" placeholder="Last name">
        <input type="password" th:field="*{password}"
               class="form-control mb-4 w-25" placeholder="password">

        <button type="submit" class="btn btn-info col-2">Register</button>
    </form>
    <p th:if="${errorMessage}" th:text="${errorMessage}" style="color:red;"></p>
    <hr>
    <a th:href="@{/persons/HomePage}">Return to Home Page</a>


</div>
</body>

</html>
