<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Person Directory</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .home-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 16px;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
        }
        .home-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
            color: white;
        }
        .home-button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

<div class="container">
    <h3>Person Directory</h3>
    <hr>

    <!-- Back to Home button -->
    <a th:href="@{/}"
       class="home-button mb-3">
        🏠 Back to Home
    </a>

    <table class="table table-bordered table -striped">
        <thead class="table-dark">
        <tr>
            <th>First Name</th>
            <th>Last Name</th>
            <th>TC No</th>
            <th>City</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="tempPerson : ${persons}">
            <td th:text="${tempPerson.firstName}"/>
            <td th:text="${tempPerson.lastName}"/>
            <td th:text="${tempPerson.tcNo}"/>
            <td th:text="${tempPerson.city}"/>

            <!-- Add Update button Link -->
            <td>
                <a th:href="@{/persons/showFormForUpdate(personId=${tempPerson.id})}"
                   class="btn btn-info btn-sm">
                    Update
                </a>

                <a th:href="@{/persons/showDialog(personId1=${person1.id} ,personId2=${tempPerson.id})}"
                   class="btn btn-info btn-sm">
                    Dialog
                </a>
                <!-- Add "delete button/link-->
                <a th:href="@{/persons/delete(personId=${tempPerson.id})}"
                   class="btn btn-danger btn-sm"
                   onclick="if (!(confirm('Are you sure you want to delete this Person?'))) return false">
                    Delete
                </a>
            </td>
        </tr>
        </tbody>
    </table>

</div>

</body>
</html>
