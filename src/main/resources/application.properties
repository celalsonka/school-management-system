#
# JDBC properties - PostgreSQL
# Credentials come from environment variables (DB_URL, DB_USERNAME, DB_PASSWORD).
# For local development you can instead put them in ./application-local.properties (git-ignored).
#
spring.config.import=optional:file:./application-local.properties

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/School_Auto}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

server.tomcat.max-swallow-size=20971520
server.tomcat.connection-timeout=60000


# Hibernate / JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

